<script>
	(function addHeadingLinks(){
		let article = document.getElementsByClassName('article-meta')[0];
		let headings = article.querySelectorAll('h1, h2, h3');
		headings.forEach(function(heading){
			if (heading.id) {
				let a = document.createElement('a');
				a.innerHTML = heading.innerHTML;
				a.href = '#'+heading.id;
				heading.innerHTML = '';
				heading.appendChild(a);
			}
		});
	})();
</script>
<script>
	(function stackSidenotes(){
		let main = document.getElementsByTagName('main')[0];
		if (!main) {
			return;
		}
		let queued = false;
		function stack() {
			queued = false;
			let bottom = -Infinity;
			main.querySelectorAll('.sidenote').forEach(function(box){
				box.style.marginTop = '';
				let rect = box.getBoundingClientRect();
				if (rect.height === 0) {
					return; // hidden on narrow screens
				}
				let shift = Math.max(0, bottom - rect.top);
				if (shift > 0) {
					box.style.marginTop = shift + 'px';
				}
				bottom = rect.bottom + shift + parseFloat(getComputedStyle(box).fontSize)/2;
			});
		}
		function queue() {
			if (!queued) {
				queued = true;
				requestAnimationFrame(stack);
			}
		}

		// justif.js re-renders paragraphs on resize and font loads, and MathJax changes them too
		new MutationObserver(queue).observe(main, {childList: true, subtree: true});
		window.addEventListener('resize', queue);
		document.fonts.ready.then(queue);
		queue();
	})();
</script>
